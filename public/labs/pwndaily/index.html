<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pwn 每日一练：每天一份 Pwn 卷子，含答案与讲解，记录你的学习轨迹">
  <title>PwnDaily · 每日一练</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="返回首页">
      <span class="brand-mark">PD</span>
      <span><strong>PwnDaily</strong><small>DAILY PWN PRACTICE</small></span>
    </button>
    <div class="topbar-center"><span class="status-dot"></span> <span id="todayLabel">--</span></div>
    <div class="topbar-actions">
      <button class="icon-button active" id="todayTab">今日试卷</button>
      <button class="icon-button" id="historyTab">历史记录</button>
      <button class="icon-button" id="exportBtn" title="导出答题记录">导出记录</button>
      <button class="icon-button" id="importBtn" title="导入答题记录">导入记录</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <span>PWNDAILY / DAILY QUIZ</span>
    <span>答题记录仅保存在当前浏览器 · 数据不上传</span>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
